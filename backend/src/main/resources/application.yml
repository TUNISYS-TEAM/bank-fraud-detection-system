spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraud-detection

keycloak:
  server-url: http://localhost:8180
  realm: fraud-detection
  client-id: fraud-backend
  client-secret: oFQ9ky6RLeSVZyiXMdCkOGKJAxkCRB28
  admin-username: admin
  admin-password: admin

server:
  port: 8100