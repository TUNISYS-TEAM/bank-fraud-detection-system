spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    clean-disabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/fraud-detection
  
  task:
    scheduling:
      pool:
        size: 2

# Session management configuration
session:
  timeout-hours: 24
  cleanup-cron: "0 0 * * * *"

keycloak:
  server-url: http://localhost:8180
  realm: fraud-detection
  client-id: fraud-backend
  client-secret: oFQ9ky6RLeSVZyiXMdCkOGKJAxkCRB28
  admin-username: admin
  admin-password: admin

storage:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: fraud-datalake

server:
  port: 8100
  servlet:
    session:
      cookie:
        http-only: true
        secure: false
        same-site: lax
        path: /
        max-age: 3600

ml-pipeline:
  base-url: http://ml-pipeline:8888

# Cookie settings
app:
  cookie:
    secure: false
    same-site: lax
    domain: localhost  
    path: /

ml:
  onnx:
    model-dir: src/main/resources/models   
 
logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: DEBUG
    com.fraud.backend.api.controller.messaging: DEBUG