services:
  postgres-app:
    image: postgres:16-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: fraud-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fraud-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb -p local/fraud-datalake || true &&
      mc anonymous set none local/fraud-datalake || true
      "

  # ML Pipeline Service
  ml-pipeline:
    build:
      context: ../ml-pipeline
      dockerfile: Dockerfile.ml
    container_name: fraud-ml-pipeline
    ports:
      - "8888:8888"
    volumes:
      - ../ml-pipeline:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - POSTGRES_HOST=postgres-app
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-fraud_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin}
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy

    command: >
      sh -c "
      echo 'ML Pipeline Container Started' &&
      echo 'Testing imports...' &&
      python scripts/quick_test.py &&
      echo 'Imports OK' &&
      echo '' &&
      echo 'Available commands:' &&
      echo '  docker exec -it fraud-ml-pipeline python scripts/generate_sample_data.py' &&
      echo '  docker exec -it fraud-ml-pipeline python -m ml_pipeline.cli.main' &&
      echo '  docker exec -it fraud-ml-pipeline python -m ml_pipeline.training.train_models --export-onnx' &&
      echo '' &&
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import lightgbm, onnxruntime; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_app_data:
  postgres_keycloak_data:
  minio_data: