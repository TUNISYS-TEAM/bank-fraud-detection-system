services:
  postgres-app:
    image: postgres:16-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KEYCLOAK_USER} -d ${POSTGRES_KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: fraud-keycloak
    command: start-dev
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}          # Should be: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}

      # Admin
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # === Critical fixes for Admin Console loading issue ===
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"                    # Recommended for Docker + direct access
      KC_PROXY_HEADERS: "forwarded"       # Modern replacement (helps with new admin console)

      # Optional but useful for debugging
      # KC_HOSTNAME_DEBUG: "true"         # Uncomment to see hostname config on /realms/master/hostname-debug
    ports:
      - "8180:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fraud-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/fraud-datalake || true &&
      mc anonymous set none local/fraud-datalake || true
      "

  ml-pipeline:
    build:
      context: ../ml-pipeline
      dockerfile: Dockerfile.ml
    container_name: fraud-ml-pipeline
    ports:
      - "8888:8888"
    volumes:
      - ../ml-pipeline:/app
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - PYTHONPATH=${PYTHONPATH}
      - MINIO_ENDPOINT=${ML_PIPELINE_MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${ML_PIPELINE_MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${ML_PIPELINE_MINIO_SECRET_KEY}
      - POSTGRES_HOST=${ML_PIPELINE_POSTGRES_HOST}
      - POSTGRES_PORT=${ML_PIPELINE_POSTGRES_PORT}
      - POSTGRES_DB=${ML_PIPELINE_POSTGRES_DB}
      - POSTGRES_USER=${ML_PIPELINE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ML_PIPELINE_POSTGRES_PASSWORD}
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
      echo 'ML Pipeline Container Started' &&
      echo 'Testing imports...' &&
      python scripts/quick_test.py &&
      echo 'Imports OK' &&
      echo '' &&
      echo 'Available commands:' &&
      echo '  docker exec -it fraud-ml-pipeline python scripts/generate_sample_data.py' &&
      echo '  docker exec -it fraud-ml-pipeline python -m ml_pipeline.cli.main' &&
      echo '  docker exec -it fraud-ml-pipeline python -m ml_pipeline.training.train_models --export-onnx' &&
      echo '' &&
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import lightgbm, onnxruntime; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_app_data:
  postgres_keycloak_data:
  minio_data: