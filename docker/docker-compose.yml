services:
  postgres-app:
    image: postgres:15-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_APP_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_KEYCLOAK_USER} -d ${POSTGRES_KEYCLOAK_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: fraud-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}

      # Admin
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

    ports:
      - "8180:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: fraud-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: fraud-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb -p local/fraud-datalake || true &&
      mc anonymous set none local/fraud-datalake || true
      "

  # Service d'inférence ONNX (Supervisé)
  ml-onnx-service:
    build:
      context: ../ml-onnx-service
      dockerfile: Dockerfile.ml
      additional_contexts:
        shared-ml: ../shared-ml
    container_name: fraud-ml-onnx
    ports:
      - "8888:8888"
    volumes:
      - ../ml-onnx-service:/app
      - ../shared-ml:/shared-ml
      - ../shared-ml/src/shared_ml:/app/src/shared_ml
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - PYTHONPATH=${PYTHONPATH}
      - MINIO_ENDPOINT=${ML_PIPELINE_MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${ML_PIPELINE_MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${ML_PIPELINE_MINIO_SECRET_KEY}
      - POSTGRES_HOST=${ML_PIPELINE_POSTGRES_HOST}
      - POSTGRES_PORT=${ML_PIPELINE_POSTGRES_PORT}
      - POSTGRES_DB=${ML_PIPELINE_POSTGRES_DB}
      - POSTGRES_USER=${ML_PIPELINE_POSTGRES_USER}
      - POSTGRES_PASSWORD=${ML_PIPELINE_POSTGRES_PASSWORD}
    depends_on:
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "
      echo 'ML ONNX Service Container Started' &&
      echo 'Testing imports...' &&
      python -c 'import ml_onnx_service; print(\"Package ml_onnx_service loaded OK\")' &&
      echo '' &&
      echo 'Available commands:' &&
      echo '  docker exec -it fraud-ml-onnx python scripts/generate_sample_data.py' &&
      echo '  docker exec -it fraud-ml-onnx python -m ml_onnx_service.cli.main' &&
      echo '  docker exec -it fraud-ml-onnx python scripts/inference_service.py --help' &&
      echo '' &&
      tail -f /dev/null
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import ml_onnx_service, shared_ml; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service d'inférence Hybride (FastAPI)
  ml-hybrid-service:
    build:
      context: ../ml-hybrid-service
      dockerfile: Dockerfile.ml
      additional_contexts:
        shared-ml: ../shared-ml
    container_name: fraud-ml-hybrid
    ports:
      - "8001:8000"
    volumes:
      - ../shared-ml/src/shared_ml:/app/src/shared_ml
      - ../ml-hybrid-service/scripts:/app/scripts
      - ../ml-hybrid-service/app:/app/app
    environment:
      - PYTHONPATH=/app/src
      - MINIO_ENDPOINT=${ML_HYBRID_MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${ML_HYBRID_MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${ML_HYBRID_MINIO_SECRET_KEY}
      - MINIO_BUCKET=${ML_HYBRID_MINIO_BUCKET}
      - LOG_LEVEL=INFO
    command: >
      sh -c "pip install shap && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: fraud-kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Additional settings for consumer groups
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

  forecast-service:
    build:
      context: ../forecast-service
      dockerfile: Dockerfile.ml
    container_name: fraud-forecast
    ports:
      - "8003:8000"
    volumes:
      - ../forecast-service/app:/app/app                          
      - ../shared-ml/src/shared_ml:/app/src/shared_ml           
    environment:
      - PYTHONUNBUFFERED=1
      - JAVA_BACKEND_URL=http://host.docker.internal:8100
      - INTERNAL_API_KEY=${API_INTERNAL_KEY:-secret}
      # POSTAL_CODES n'est plus nécessaire
    restart: unless-stopped

volumes:
  postgres_app_data:
  postgres_keycloak_data:
  minio_data:
  kafka_data: