[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pipeline"
version = "1.0.0"
description = "Pipeline de détection de fraude"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "lightgbm>=3.3.0",
    "catboost>=1.1.0",
    "xgboost>=1.6.0",
    "onnx>=1.12.0",
    "onnxruntime>=1.14.0",
    "onnxmltools>=1.11.0",
    "skl2onnx>=1.14.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.26.0",
    "minio>=7.1.0",
    "pydantic>=2.0.0",
    "pandera>=0.17.0",
    "pyod>=1.0.0",
    "scipy>=1.7.0",
    "tqdm>=4.65.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_pipeline*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"ml_pipeline.utils.resources" = ["*.json"]
"ml_pipeline.config" = ["*.json"]