<header
    class="h-20 bg-white border-b border-gray-200 px-8 flex items-center justify-between sticky top-0 z-10 shadow-sm">
    <div class="flex flex-col">
        <h1 class="text-2xl font-bold text-gray-800">Système de Détection de Fraude Bancaire</h1>
        <p class="text-sm text-gray-500">Surveillance et analyse en temps réel</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-6">

        <!-- Notifications -->
        <button class="relative p-2 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-2 right-2 flex h-2.5 w-2.5">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 border-2 border-white"></span>
            </span>
        </button>

        <!-- User Menu -->
        <div class="flex items-center space-x-3 pl-6 border-l border-gray-100">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-semibold text-gray-800">{{ authStore.userName() || 'Utilisateur' }}</p>
                <p class="text-xs text-indigo-500 font-medium uppercase tracking-wider">{{ authStore.userRoleLabel() }}
                </p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 p-0.5 shadow-md">
                <div
                    class="w-full h-full rounded-[9px] bg-white flex items-center justify-center font-bold text-indigo-600">
                    {{ (authStore.userName() || 'U')[0].toUpperCase() }}
                </div>
            </div>
        </div>
    </div>
</header>
