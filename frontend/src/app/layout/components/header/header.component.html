<header
    class="h-20 bg-white border-b border-gray-200 px-4 sm:px-8 flex items-center justify-between sticky top-0 z-10 shadow-sm">
    <div class="flex flex-col min-w-0">
        <h1 class="text-lg sm:text-xl lg:text-2xl font-bold text-gray-800 truncate">Système de Détection de Fraude
            Bancaire</h1>
        <p class="text-xs sm:text-sm text-gray-500 truncate">Surveillance et analyse en temps réel</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-6">

        <!-- Notifications -->
        <button class="relative p-2 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-xl transition-all">
            <i-feather name="bell" class="w-6 h-6"></i-feather>
            <span class="absolute top-2 right-2 flex h-2.5 w-2.5">

                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 border-2 border-white"></span>
            </span>
        </button>

        <!-- User Menu — Clickable → Profile -->
        <a routerLink="/dashboard/profile"
            class="flex items-center space-x-3 pl-6 border-l border-gray-100 cursor-pointer group no-underline">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-semibold text-gray-800 group-hover:text-indigo-600 transition-colors">{{ authStore.userName() || 'Utilisateur' }}</p>
                <p class="text-xs text-indigo-500 font-medium uppercase tracking-wider">{{ authStore.userRoleLabel() }}
                </p>
            </div>
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 p-0.5 shadow-md group-hover:shadow-lg group-hover:shadow-indigo-500/30 transition-all">
                <div
                    class="w-full h-full rounded-[9px] bg-white flex items-center justify-center font-bold text-indigo-600">
                    {{ (authStore.userName() || 'U')[0].toUpperCase() }}
                </div>
            </div>
        </a>
    </div>
</header>
