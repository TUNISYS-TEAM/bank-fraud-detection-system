<!-- Backdrop avec flou -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 transition-all duration-300"
    [class.opacity-0]="!isVisible()" [class.opacity-100]="isVisible()" (click)="closeModal()">

    <!-- Modal -->
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden transform transition-all border border-gray-100"
        [class.scale-95]="!isVisible()" [class.scale-100]="isVisible()" (click)="$event.stopPropagation()">

        <!-- Header avec design amélioré -->
        <div class="px-6 py-5 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-indigo-50 to-purple-50">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-indigo-100 rounded-xl">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                              d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-gray-900">Exporter les logs</h3>
                    <p class="text-xs text-gray-500 mt-0.5">Choisissez le format et la période</p>
                </div>
            </div>
            <button (click)="closeModal()" 
                    class="text-gray-400 hover:text-gray-600 hover:bg-white/50 p-2 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Body -->
        <div class="px-6 py-6">
            <div class="space-y-6">
                <!-- Format selection avec design amélioré -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Format d'export
                    </label>
                    <div class="grid grid-cols-3 gap-3">
                        <!-- CSV -->
                        <label class="relative cursor-pointer">
                            <input type="radio" [ngModel]="exportFormat()" (ngModelChange)="exportFormat.set($event)" 
                                   value="csv" class="sr-only peer">
                            <div class="flex flex-col items-center p-3 border rounded-xl peer-checked:ring-2 peer-checked:ring-indigo-500 peer-checked:border-indigo-500 transition-all bg-white hover:bg-gray-50">
                                <svg class="w-6 h-6 text-green-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <span class="text-xs font-medium">CSV</span>
                            </div>
                        </label>

                        <!-- JSON -->
                        <label class="relative cursor-pointer">
                            <input type="radio" [ngModel]="exportFormat()" (ngModelChange)="exportFormat.set($event)" 
                                   value="json" class="sr-only peer">
                            <div class="flex flex-col items-center p-3 border rounded-xl peer-checked:ring-2 peer-checked:ring-indigo-500 peer-checked:border-indigo-500 transition-all bg-white hover:bg-gray-50">
                                <svg class="w-6 h-6 text-blue-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                                <span class="text-xs font-medium">JSON</span>
                            </div>
                        </label>

                        <!-- PDF -->
                        <label class="relative cursor-pointer">
                            <input type="radio" [ngModel]="exportFormat()" (ngModelChange)="exportFormat.set($event)" 
                                   value="pdf" class="sr-only peer">
                            <div class="flex flex-col items-center p-3 border rounded-xl peer-checked:ring-2 peer-checked:ring-indigo-500 peer-checked:border-indigo-500 transition-all bg-white hover:bg-gray-50">
                                <svg class="w-6 h-6 text-red-600 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                          d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                </svg>
                                <span class="text-xs font-medium">PDF</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Date range selection amélioré -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-3 flex items-center">
                        <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        Période
                    </label>
                    <div class="flex p-1 bg-gray-100 rounded-lg mb-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" [ngModel]="exportDateRange()" (ngModelChange)="exportDateRange.set($event)" 
                                   value="all" class="sr-only peer">
                            <div class="text-center py-2 px-4 rounded-md text-sm font-medium peer-checked:bg-white peer-checked:text-indigo-700 peer-checked:shadow-sm transition-all">
                                Tous
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" [ngModel]="exportDateRange()" (ngModelChange)="exportDateRange.set($event)" 
                                   value="custom" class="sr-only peer">
                            <div class="text-center py-2 px-4 rounded-md text-sm font-medium peer-checked:bg-white peer-checked:text-indigo-700 peer-checked:shadow-sm transition-all">
                                Personnalisée
                            </div>
                        </label>
                    </div>

                    @if (exportDateRange() === 'custom') {
                        <div class="space-y-3 mt-3 animate-fadeIn">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Date de début</label>
                                <input type="date"
                                       [ngModel]="exportCustomFrom()"
                                       (ngModelChange)="exportCustomFrom.set($event)"
                                       class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-white">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Date de fin</label>
                                <input type="date"
                                       [ngModel]="exportCustomTo()"
                                       (ngModelChange)="exportCustomTo.set($event)"
                                       class="w-full px-3 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all bg-white">
                            </div>
                        </div>
                    }
                </div>

                <!-- Current filters summary amélioré -->
                @if (hasActiveFilters()) {
                    <div class="bg-indigo-50 rounded-lg p-4 border border-indigo-100">
                        <h4 class="text-xs font-semibold text-indigo-700 uppercase tracking-wider mb-2 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                            </svg>
                            Filtres actifs
                        </h4>
                        <div class="flex flex-wrap gap-2">
                            @if (searchTerm) {
                                <span class="inline-flex items-center px-2 py-1 bg-white text-indigo-700 text-xs rounded border border-indigo-200">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                    {{ searchTerm }}
                                </span>
                            }
                            @if (levelFilter) {
                                <span class="inline-flex items-center px-2 py-1 bg-white text-indigo-700 text-xs rounded border border-indigo-200">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    {{ levelFilter }}
                                </span>
                            }
                            @if (dateFrom && dateTo) {
                                <span class="inline-flex items-center px-2 py-1 bg-white text-indigo-700 text-xs rounded border border-indigo-200">
                                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                    {{ dateFrom }} au {{ dateTo }}
                                </span>
                            }
                        </div>
                    </div>
                }
            </div>
        </div>

        <!-- Footer amélioré -->
        <div class="px-6 py-4 border-t border-gray-100 flex items-center justify-end space-x-3 bg-gray-50/80">
            <button (click)="closeModal()"
                    class="px-4 py-2 text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 hover:border-gray-300 transition-all text-sm font-medium shadow-sm">
                Annuler
            </button>
            <button (click)="onExport()"
                    class="px-4 py-2 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white rounded-lg transition-all text-sm font-medium shadow-lg shadow-indigo-600/25 flex items-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                          d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Exporter</span>
            </button>
        </div>
    </div>
</div>
