<div class="space-y-6 animate-fadeIn p-4">
    <!-- Banniere d'accueil -->
    <div class="bg-[#fdfaff] border border-purple-200 rounded-2xl p-8 shadow-sm relative overflow-hidden">
        <div class="flex items-start space-x-6">
            <!-- Icône -->
            <div class="p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-purple-600" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>

            <div class="flex-1">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">
                    Bienvenue, {{ roleDisplay() }}, {{ authStore.userName() }} !
                </h2>
                <p class="text-gray-500 text-base mb-6">
                    {{ roleDescription() }}
                </p>

                <!-- Features Grid Dynamique -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-y-3 gap-x-12">
                    @for (feature of features(); track feature) {
                    <div class="flex items-center space-x-3 text-sm text-gray-600">
                        <span class="w-1.5 h-1.5 rounded-full bg-purple-400"></span>
                        <span>{{ feature }}</span>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
