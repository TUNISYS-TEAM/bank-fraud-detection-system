<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-blue-50 via-blue-100/40 to-slate-100 px-4 py-8">

  <button (click)="closeWindow()"
    class="absolute top-6 right-6 p-2 text-gray-400 hover:text-gray-800 hover:bg-black/5 rounded-full">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <div class="text-center mb-8">
    <div
      class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 text-white mb-5">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        <path d="M9 12l2 2 4-4" />
      </svg>
    </div>
    <h1 class="text-3xl font-bold text-gray-900">Détection de Fraude Bancaire</h1>
    <p class="text-base text-gray-500 mt-2">Connectez-vous à la plateforme</p>
  </div>

  @if (authStore.errorMessage(); as error) {
    <div class="w-full max-w-lg mb-4 p-4 bg-red-50 border-l-4 border-red-500 rounded">
      <p class="text-sm text-red-700">{{ error }}</p>
    </div>
  }

  <div class="w-full max-w-lg bg-white rounded-3xl px-10 pt-10 pb-8 shadow-lg">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">

      <!-- Champ Nom d'utilisateur -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Nom d'utilisateur</label>
        <div class="relative">
          <svg class="absolute left-4 top-3.5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="M22 7l-10 6L2 7" />
          </svg>
          <input type="text" formControlName="username" placeholder="Email" 
            class="w-full pl-12 pr-4 py-3.5 border rounded-xl outline-none focus:border-blue-500"
            [class.border-red-300]="loginForm.get('username')?.touched && loginForm.get('username')?.invalid">
        </div>
        @if (usernameErrors) {
          <p class="mt-1 text-xs text-red-600">{{ usernameErrors }}</p>
        }
      </div>

      <!-- Champ Mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
        <div class="relative">
          <svg class="absolute left-4 top-3.5 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
            viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••"
            class="w-full pl-12 pr-12 py-3.5 border rounded-xl outline-none focus:border-blue-500"
            [class.border-red-300]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <button type="button" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600" (click)="togglePassword()">
            @if (!showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            }
          </button>
        </div>
        @if (passwordErrors) {
          <p class="mt-1 text-xs text-red-600">{{ passwordErrors }}</p>
        }
      </div>

      <!-- Bouton de connexion -->
      <button type="submit" [disabled]="loginForm.invalid || authStore.isLoading()"
        class="w-full py-3.5 text-lg font-semibold text-white bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl disabled:opacity-50 flex items-center justify-center gap-2">
        @if (authStore.isLoading()) {
          <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span>Connexion...</span>
        } @else {
          <span>Se connecter</span>
        }
      </button>

    </form>
  </div>
</div>
