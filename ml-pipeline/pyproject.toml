# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_pipeline"
version = "0.1.0"
description = "Fraud detection ML pipeline with LightGBM, XGBoost, CatBoost, and ONNX export"
readme = "README.md"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.1.0",
    "lightgbm>=3.3.0",
    "catboost>=1.1.0",
    "xgboost>=1.6.0",
    "onnx>=1.12.0",
    "onnxruntime>=1.14.0",
    "onnxmltools>=1.11.0",
    "skl2onnx>=1.14.0",
    "netron>=7.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.26.0",
    "minio>=7.1.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pydantic>=2.0.0",          # added for schemas/settings
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.0.260",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ml-pipeline = "ml_pipeline.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_pipeline*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"ml_pipeline.utils.resources" = ["*.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I", "N", "UP", "YTT", "ANN", "B", "A", "C4", "SIM", "ARG", "PTH", "PL", "RUF"]
ignore = ["ANN101", "ANN102"]  # allow missing type annotation for self/cls

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true